apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-orchestrator-sa
  namespace: rag-app
  annotations:
    argocd.argoproj.io/sync-wave: "9"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-orchestrator
  namespace: rag-app
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-orchestrator
  template:
    metadata:
      labels:
        app: rag-orchestrator
    spec:
      serviceAccountName: rag-orchestrator-sa
      containers:
        - name: orchestrator
          image: image-registry.openshift-image-registry.svc:5000/rag-app/rag-orchestrator:latest
          ports:
            - containerPort: 8000
          env:
            - name: VLLM_BASE_URL
              value: "http://vllm-qwen.rag-models.svc:8000"
            - name: EMBEDDING_URL
              value: "http://bge-m3-embedding.rag-models.svc:8080"
            - name: RERANKER_URL
              value: "http://bge-reranker.rag-models.svc:8080"
            - name: GUARDIAN_URL
              value: "http://guardian.rag-models.svc:8080"
            - name: MODEL_NAME
              value: "qwen-14b"
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: rag-db-pguser-postgres
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: rag-db-pguser-postgres
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: rag-db-pguser-postgres
                  key: user
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-db-pguser-postgres
                  key: password
            - name: PG_DBNAME
              valueFrom:
                secretKeyRef:
                  name: rag-db-pguser-postgres
                  key: dbname
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rag-orchestrator
  namespace: rag-app
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  selector:
    app: rag-orchestrator
  ports:
    - port: 8000
      targetPort: 8000
