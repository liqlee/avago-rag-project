apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  operator:
    defaultRuntime: crio
  daemonsets: {}
  driver:
    enabled: true
    useOpenKernelModules: true
  devicePlugin:
    enabled: true
    config:
      name: device-plugin-config
      default: A10G
  dcgm:
    enabled: true
  dcgmExporter:
    enabled: true
  gfd:
    enabled: true
  nodeStatusExporter:
    enabled: true
  toolkit:
    enabled: true
