apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-7b
  namespace: rag-models
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    security.opendatahub.io/enable-auth: "false"
    openshift.io/display-name: "Qwen 2.5 7B Instruct (GGUF Q4_K_M)"
    openshift.io/description: "Qwen 2.5 7B Instruct with Q4_K_M quantization for RAG answer generation on GPU (CUDA)"
    opendatahub.io/model-type: text-generation
    argocd.argoproj.io/sync-wave: "8"
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    model:
      modelFormat:
        name: gguf
      runtime: llamacpp-gpu
      storage:
        key: minio
        path: qwen-7b
      args:
        - -m
        - /mnt/models/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf
        - -c
        - "8192"
        - -t
        - "4"
        - -a
        - qwen-7b
      resources:
        requests:
          cpu: "4"
          memory: "4Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "6Gi"
          nvidia.com/gpu: "1"
    maxReplicas: 1
    minReplicas: 1
    deploymentStrategy:
      type: Recreate
    timeout: 300
---
# Bypass Service — preserves the orchestrator's existing URL
# (vllm-qwen.rag-models.svc:8000)
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: rag-models
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    serving.kserve.io/inferenceservice: qwen-7b
  ports:
    - port: 8000
      targetPort: 8080
