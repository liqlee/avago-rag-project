apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: rag-pipelines
---
# Grants the pipeline SA push access to the internal registry for rag-app images
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-image-builder
  namespace: rag-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: rag-pipelines
---
# Allows the pipeline SA to restart deployments in rag-app
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-deployer
  namespace: rag-app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-deployer
  namespace: rag-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-deployer
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: rag-pipelines
